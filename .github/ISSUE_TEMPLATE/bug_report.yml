name: Bug report
description: Report a reproducible defect in rules, AI, persistence, replay, UI, or tooling
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include API keys, private data, undisclosed hands from another player, or vulnerability details that should be reported privately under SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the smallest deterministic sequence you can.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit / version
      description: Commit SHA, branch, or release if known.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Rules engine
        - Expert / local AI
        - PIMC / ISMCTS / evaluation
        - Replay / persistence
        - Local server / cloud enhancement
        - UI / interaction
        - Verification / CI
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or evidence
      description: Paste sanitized logs, screenshots, or test output. Remove secrets and private information.
